services:
  frontend:
      build: ./frontend
      container_name: frontend
      ports:
        - 80:3000
      configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf
      networks:
        - school_external_network
      depends_on:
        api-gateway:
          condition: service_started
        auth-service:
            condition: service_started
        school-structure-service:
          condition: service_started
        grade-service:
          condition: service_started
        schedule-service:
          condition: service_started
        teaching-service:
          condition: service_started

  api-gateway:
    build:
      context: ./backend/api-gateway
    container_name: api-gateway
    restart: unless-stopped
    env_file:
      - ./backend/api-gateway/.env
    networks:
      - school_external_network
      - school_internal_network
    depends_on:
      auth-service:
        condition: service_started
      school-structure-service:
        condition: service_started
      grade-service:
        condition: service_started
      schedule-service:
        condition: service_started
      teaching-service:
        condition: service_started

  school-structure-service:
    build:
      context: ./backend
      dockerfile: school-structure-service/Dockerfile
    container_name: school-structure-service
    restart: unless-stopped
    networks:
      - school_internal_network
    environment:
      DB_HOST: school-structure-service-db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    secrets:
      - source: school_structure_db_user
        target: DB_USER
      - source: school_structure_db_password
        target: DB_PASSWORD
    depends_on:
      school-structure-service-db:
        condition: service_healthy

  grade-service:
    build:
      context: ./backend/
      dockerfile: grade-service/Dockerfile
    container_name: grade-service
    restart: unless-stopped
    networks:
      - school_internal_network
    environment:
      DB_HOST: grade-service-db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SCHOOL_STRUCTURE_HOST: school-structure-service
      SCHOOL_STRUCTURE_GRPC_PORT: 9090
    secrets:
      - source: grade_db_user
        target: DB_USER
      - source: grade_db_password
        target: DB_PASSWORD
    depends_on:
      grade-service-db:
        condition: service_healthy
      school-structure-service:
        condition: service_started

  schedule-service:
    build:
      context: ./backend/
      dockerfile: schedule-service/Dockerfile
    container_name: schedule-service
    restart: unless-stopped
    networks:
      - school_internal_network
    environment:
      DB_HOST: schedule-service-db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SCHOOL_STRUCTURE_HOST: school-structure-service
      SCHOOL_STRUCTURE_GRPC_PORT: 9090
    secrets:
      - source: schedule_db_user
        target: DB_USER
      - source: schedule_db_password
        target: DB_PASSWORD
    depends_on:
      schedule-service-db:
        condition: service_healthy
      school-structure-service:
        condition: service_started

  teaching-service:
    build:
      context: ./backend/
      dockerfile: teaching-service/Dockerfile
    container_name: teaching-service
    restart: unless-stopped
    networks:
      - school_internal_network
    environment:
      DB_HOST: teaching-service-db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SCHOOL_STRUCTURE_HOST: school-structure-service
      SCHOOL_STRUCTURE_GRPC_PORT: 9090
    secrets:
      - source: teaching_db_user
        target: DB_USER
      - source: teaching_db_password
        target: DB_PASSWORD
    depends_on:
      teaching-service-db:
        condition: service_healthy
      school-structure-service:
        condition: service_started

  auth-service:
    build: ./backend/auth-service
    container_name: auth-service
    restart: unless-stopped
    networks:
      - school_internal_network
      - auth_network
    environment:
      DB_HOST: auth-service-db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    secrets:
      - source: auth_db_user
        target: DB_USER
      - source: auth_db_password
        target: DB_PASSWORD
    depends_on:
      auth-service-db:
        condition: service_healthy

  auth-service-db:
    image: postgres:16-alpine
    container_name: auth-service-db
    restart: unless-stopped
    networks:
      - auth_network
    environment:
      POSTGRES_DB: auth-service-db
      POSTGRES_USER_FILE: /run/secrets/DB_USER
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PASSWORD
    secrets:
      - source: auth_db_user
        target: DB_USER
      - source: auth_db_password
        target: DB_PASSWORD
    volumes:
      - auth_service_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$(cat /run/secrets/DB_USER)\" -d auth-service-db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  schedule-service-db:
    image: postgres:16-alpine
    container_name: schedule-service-db
    restart: unless-stopped
    networks:
      - school_internal_network
      - schedule_network
    environment:
      POSTGRES_DB: schedule-service-db
      POSTGRES_USER_FILE: /run/secrets/DB_USER
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PASSWORD
    secrets:
      - source: schedule_db_user
        target: DB_USER
      - source: schedule_db_password
        target: DB_PASSWORD
    volumes:
      - schedule_service_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$(cat /run/secrets/DB_USER)\" -d schedule-service-db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  grade-service-db:
    image: postgres:16-alpine
    container_name: grade-service-db
    restart: unless-stopped
    networks:
      - school_internal_network
      - grade_network
    environment:
      POSTGRES_DB: grade-service-db
      POSTGRES_USER_FILE: /run/secrets/DB_USER
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PASSWORD
    secrets:
      - source: grade_db_user
        target: DB_USER
      - source: grade_db_password
        target: DB_PASSWORD
    volumes:
      - grade_service_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$(cat /run/secrets/DB_USER)\" -d grade-service-db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  teaching-service-db:
    image: postgres:16-alpine
    container_name: teaching-service-db
    restart: unless-stopped
    networks:
      - school_internal_network
      - teaching_network
    environment:
      POSTGRES_DB: teaching-service-db
      POSTGRES_USER_FILE: /run/secrets/DB_USER
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PASSWORD
    secrets:
      - source: teaching_db_user
        target: DB_USER
      - source: teaching_db_password
        target: DB_PASSWORD
    volumes:
      - teaching_service_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$(cat /run/secrets/DB_USER)\" -d teaching-service-db"]
      interval: 5s
      timeout: 5s
      retries: 5

  school-structure-service-db:
    image: postgres:16-alpine
    container_name: school-structure-service-db
    restart: unless-stopped
    networks:
      - school_internal_network
      - school_structure_network
    environment:
      POSTGRES_DB: school-structure-service-db
      POSTGRES_USER_FILE: /run/secrets/DB_USER
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PASSWORD
    secrets:
      - source: school_structure_db_user
        target: DB_USER
      - source: school_structure_db_password
        target: DB_PASSWORD
    volumes:
      - school-structure_service_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$(cat /run/secrets/DB_USER)\" -d school-structure-service-db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    networks:
      - school_internal_network
      - school_network
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

volumes:
  auth_service_data:
  teaching_service_data:
  school-structure_service_data:
  grade_service_data:
  schedule_service_data:

networks:
  school_external_network:
  school_internal_network:
  auth_network:
  school_structure_network:
  grade_network:
  schedule_network:
  teaching_network:
  school_network:
    driver: bridge
    external: true

configs:
  nginx_config:
    file: ./frontend/nginx/nginx.conf

secrets:
  auth_db_user:
    environment: AUTH_DB_USER
  auth_db_password:
    environment: AUTH_DB_PASSWORD
  grade_db_user:
    environment: GRADE_DB_USER
  grade_db_password:
    environment: GRADE_DB_PASSWORD
  schedule_db_user:
    environment: SCHEDULE_DB_USER
  schedule_db_password:
    environment: SCHEDULE_DB_PASSWORD
  teaching_db_user:
    environment: TEACHING_DB_USER
  teaching_db_password:
    environment: TEACHING_DB_PASSWORD
  school_structure_db_user:
    environment: SCHOOL_STRUCTURE_DB_USER
  school_structure_db_password:
    environment: SCHOOL_STRUCTURE_DB_PASSWORD