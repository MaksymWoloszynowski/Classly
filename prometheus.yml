global:
  scrape_interval: 15s

scrape_configs:
  - job_name: classly
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:9091
          - auth-service:9091
          - school-structure-service:9091
          - grade-service:9091
          - schedule-service:9091
          - teaching-service:9091