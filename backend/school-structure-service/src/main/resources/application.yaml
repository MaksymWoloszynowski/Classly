debug: true

server:
  port: 8081

spring:
  config:
    import: optional:configtree:/run/secrets/
  application:
    name: school-structure-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/school-structure-service-db
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: kafka:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

  grpc:
    server:
      port: 9090


jwt:
  secret: ${JWT_SECRET}
  access-token-validity-ms: 900000

springdoc:
  api-docs:
    path: /docs/school-structure/v3/api-docs
  swagger-ui:
    path: /docs/school-structure/swagger-ui.html