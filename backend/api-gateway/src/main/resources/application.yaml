spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service-route
              uri: http://auth-service:8085
              predicates:
                - Path=/auth/**

            - id: school-structure-service-route
              uri: http://school-structure-service:8081
              predicates:
                - Path=/api/group/**,/api/admin/**,/api/student/**,/api/teacher/**,/api/subject/**,/api/parent/**,/api/teaching-assignment/**,/api/my-profile/**,/api/classification-period/**,/api/statistics/**
              filters:
                - StripPrefix=1

            - id: grade-service-route
              uri: http://grade-service:8082
              predicates:
                - Path=/api/grade/**,/api/semester-grade/**,/api/grade-category/**
              filters:
                - StripPrefix=1

            - id: schedule-service-route
              uri: http://schedule-service:8083
              predicates:
                - Path=/api/schedule/**,/api/schedule-override/**,/api/additional-schedule/**
              filters:
                - StripPrefix=1

            - id: teaching-service-route
              uri: http://teaching-service:8084
              predicates:
                - Path=/api/assessment/**,/api/attendance/**,/api/session/**
              filters:
                - StripPrefix=1

            - id: grade-swagger
              uri: http://grade-service:8082
              predicates:
                - Path=/docs/grade/**

            - id: schedule-swagger
              uri: http://schedule-service:8083
              predicates:
                - Path=/docs/schedule/**

            - id: school-structure-swagger
              uri: http://school-structure-service:8081
              predicates:
                - Path=/docs/school-structure/**

            - id: teaching-swagger
              uri: http://teaching-service:8084
              predicates:
                - Path=/docs/teaching/**

            - id: auth-swagger
              uri: http://auth-service:8085
              predicates:
                - Path=/docs/auth/**

jwt:
  secret: ${JWT_SECRET:VvyRVvEHvgAySvx17fYT6sCr1AXkuDvW66uiuFDwfVP}
  access-token-validity-ms: 900000

logging:
  level:
    org.springframework.security: DEBUG