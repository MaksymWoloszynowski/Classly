server:
  port: 8083

spring:
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  config:
    import: optional:configtree:/run/secrets/
  application:
    name: schedule-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/schedule-service-db
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  grpc:
    client:
      channel:
        schoolStructure:
          target: static://${SCHOOL_STRUCTURE_HOST:localhost}:${SCHOOL_STRUCTURE_GRPC_PORT:9090}
          negotiation-type: plaintext

    server:
      port: -1

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-ms: 900000

springdoc:
  api-docs:
    path: /docs/schedule/v3/api-docs
  swagger-ui:
    path: /docs/schedule/swagger-ui.html

management:
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: ecs
