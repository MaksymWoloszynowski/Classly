services:
  auth-service:
    build: ./
    container_name: auth-service
    restart: unless-stopped
    networks:
      - school_network
    environment:
      DB_HOST: auth-service-db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SCHOOL_STRUCTURE_HOST: school-structure-service
      SCHOOL_STRUCTURE_GRPC_PORT: 9090
    secrets:
      - source: db_user
        target: DB_USER
      - source: db_password
        target: DB_PASSWORD
    ports:
      - "8085:8085"
    depends_on:
      auth-service-db:
        condition: service_healthy

  auth-service-db:
    image: postgres:16-alpine
    container_name: auth-service-db
    restart: unless-stopped
    networks:
      - school_network
    environment:
      POSTGRES_DB: auth-service-db
      POSTGRES_USER_FILE: /run/secrets/DB_USER
      POSTGRES_PASSWORD_FILE: /run/secrets/DB_PASSWORD
    secrets:
      - source: db_user
        target: DB_USER
      - source: db_password
        target: DB_PASSWORD
    volumes:
      - auth_service_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$(cat /run/secrets/DB_USER)\" -d auth-service-db" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  auth_service_data:

networks:
  school_network:
    driver: bridge
    external: true

secrets:
  db_user:
    environment: DB_USER
  db_password:
    environment: DB_PASSWORD